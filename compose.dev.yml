# 開発専用override。ソースコードはbind mountせず、Compose Watchで同期する。
services:
  # 本番用の静的配信コンテナは開発時には起動しない。
  web:
    profiles: [production]

  vite:
    build:
      context: ./vite
      dockerfile: Dockerfile
      target: dev
    ports:
      - "4000:4000"
    restart: "no"
    volumes:
      - vite_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./vite
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - .vite/
            - .env*
        - action: rebuild
          path: ./vite/package.json
        - action: rebuild
          path: ./vite/yarn.lock

  api:
    build:
      target: dev
    command: ["yarn", "start"]
    restart: "no"
    volumes:
      - api_node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - .env*
            - "*.pem"
            - "*.key"
            - config.local.*
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/yarn.lock

  nfc:
    develop:
      watch:
        - action: sync+restart
          path: ./nfc
          target: /app
          initial_sync: true
          ignore:
            - __pycache__/
            - .env*
            - "*.pyc"
        - action: rebuild
          path: ./nfc/requirements.txt

volumes:
  api_node_modules:
  vite_node_modules:
