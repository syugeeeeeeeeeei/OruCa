services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  mysql:
    build:
      context: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-OruCa_DB}
      MYSQL_USER: ${MYSQL_USER:-OruCa_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-OruCa_user_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    cap_add:
      - SYS_NICE
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 3
      start_period: 10s
      timeout: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DB_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-OruCa_DB}
      MYSQL_USER: ${MYSQL_USER:-OruCa_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-OruCa_user_pass}
      ADMIN_FIXED_PASSWORD: ${ADMIN_FIXED_PASSWORD:-fukaya_lab}
      DEBUG_ADMIN_ENABLED: ${DEBUG_ADMIN_ENABLED:-false}
      DEBUG_ADMIN_USER: ${DEBUG_ADMIN_USER:-test-user}
      DEBUG_ADMIN_PASSWORD: ${DEBUG_ADMIN_PASSWORD:-test-password}
      SLACK_TOKEN_ENC_KEY: ${SLACK_TOKEN_ENC_KEY:-}
      BACKUP_DIR: /backups
      RUNTIME_CONFIG_DIR: /app/runtime-config
      TZ: Asia/Tokyo
    volumes:
      - api_runtime_config:/app/runtime-config
      - api_backups:/backups
    depends_on:
      mysql:
        condition: service_healthy

  nfc:
    build:
      context: nfc
    init: true
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
    command: ["python", "main.py"]
    depends_on:
      - api
    devices:
      - /dev/bus/usb:/dev/bus/usb

volumes:
  mysql_data:
  mysql_backups:
  api_runtime_config:
  api_backups:
